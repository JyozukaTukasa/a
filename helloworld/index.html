<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELLO WORLD // CYBERPUNK</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ========================================
           サイバーパンク風ハローワールド
           - ネオンカラー、グリッチ、グロー効果
        ======================================== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-cyan: #00f5ff;
            --neon-pink: #ff00ff;
            --neon-yellow: #f0ff00;
            --dark-bg: #0a0a0f;
            --grid-color: rgba(0, 245, 255, 0.1);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--dark-bg);
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
        }

        /* グリッド背景 */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* スキャンライン効果 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
        }

        /* メインコンテナ */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* メインタイトル */
        .title {
            font-size: clamp(3rem, 12vw, 10rem);
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            animation: flicker 3s infinite;
        }

        .title::before,
        .title::after {
            content: 'ハローワールド';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* シアングロー */
        .title::before {
            color: var(--neon-cyan);
            text-shadow: 
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan),
                0 0 80px var(--neon-cyan);
            animation: glitch-cyan 2.5s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }

        /* ピンクグロー */
        .title::after {
            color: var(--neon-pink);
            text-shadow: 
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-pink);
            animation: glitch-pink 3s infinite;
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }

        /* グリッチアニメーション */
        @keyframes glitch-cyan {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
        }

        @keyframes glitch-pink {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(3px, -3px); }
            50% { transform: translate(-3px, 3px); }
            75% { transform: translate(3px, 3px); }
        }

        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
                opacity: 1;
            }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
                opacity: 0.4;
            }
        }

        /* サブテキスト */
        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            color: var(--neon-cyan);
            margin-top: 2rem;
            letter-spacing: 0.5em;
            text-shadow: 0 0 10px var(--neon-cyan);
            animation: typing 4s steps(30) infinite;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--neon-cyan);
        }

        @keyframes typing {
            0%, 100% { width: 0; }
            50%, 90% { width: 100%; }
        }

        /* 装飾バー */
        .deco-bar {
            width: 80%;
            max-width: 600px;
            height: 2px;
            margin: 2rem auto;
            background: linear-gradient(90deg, 
                transparent, 
                var(--neon-cyan), 
                var(--neon-pink), 
                var(--neon-cyan), 
                transparent
            );
            position: relative;
            animation: pulse 2s ease-in-out infinite;
        }

        .deco-bar::before,
        .deco-bar::after {
            content: '◆';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            font-size: 0.8rem;
        }

        .deco-bar::before { left: -20px; }
        .deco-bar::after { right: -20px; }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--neon-cyan); }
            50% { opacity: 0.5; box-shadow: 0 0 20px var(--neon-pink); }
        }

        /* フローティングパーティクル */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: float 10s infinite;
        }

        .particle:nth-child(2) { left: 10%; animation-delay: -2s; background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .particle:nth-child(3) { left: 20%; animation-delay: -4s; }
        .particle:nth-child(4) { left: 30%; animation-delay: -1s; background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .particle:nth-child(5) { left: 40%; animation-delay: -3s; }
        .particle:nth-child(6) { left: 50%; animation-delay: -5s; background: var(--neon-yellow); box-shadow: 0 0 10px var(--neon-yellow); }
        .particle:nth-child(7) { left: 60%; animation-delay: -2.5s; }
        .particle:nth-child(8) { left: 70%; animation-delay: -1.5s; background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .particle:nth-child(9) { left: 80%; animation-delay: -4.5s; }
        .particle:nth-child(10) { left: 90%; animation-delay: -0.5s; background: var(--neon-yellow); box-shadow: 0 0 10px var(--neon-yellow); }

        @keyframes float {
            0%, 100% { 
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(10vh) scale(1);
            }
            100% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }
        }

        /* コーナー装飾 */
        .corner {
            position: fixed;
            width: 100px;
            height: 100px;
            border: 2px solid var(--neon-cyan);
            z-index: 20;
        }

        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* システムテキスト */
        .system-text {
            position: fixed;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            opacity: 0.6;
            z-index: 20;
        }

        .system-text.top { top: 30px; left: 50%; transform: translateX(-50%); }
        .system-text.bottom { bottom: 30px; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>
    <!-- 背景グリッド -->
    <div class="grid-bg"></div>
    
    <!-- スキャンライン -->
    <div class="scanlines"></div>
    
    <!-- パーティクル -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <!-- コーナー装飾 -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    
    <!-- システムテキスト -->
    <div class="system-text top">[ SYSTEM ONLINE // NEURAL LINK ACTIVE ]</div>
    <div class="system-text bottom">// TOKYO-3 NETWORK // 2077.02.02 //</div>
    
    <!-- メインコンテンツ -->
    <div class="container">
        <div class="deco-bar"></div>
        <h1 class="title">ハローワールド</h1>
        <div class="deco-bar"></div>
        <p class="subtitle">&gt;&gt; WELCOME TO THE FUTURE _</p>
    </div>
</body>
</html>
